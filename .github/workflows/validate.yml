name: Validate Radio Frequencies

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package, catalog, manifests, and stable metadata
        run: python tools/validate_catalog.py
      - name: Reject malformed text files
        run: git diff --check
